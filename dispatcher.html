<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAHAYAK — Dispatcher Console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0b1020;--panel:#121a30;--panel2:#0f1730;--line:#22304f;
    --txt:#e8eefc;--mut:#8fa3c8;--acc:#38bdf8;--ok:#34d399;--warn:#fbbf24;
    --crit:#f87171;--high:#fb923c;--purple:#a78bfa;--ai:#c084fc;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif}
  body{background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--crit);display:flex;align-items:center;justify-content:center;font-size:18px}
  .brand h1{font-size:17px;letter-spacing:.5px}
  .hstat{display:flex;gap:18px;margin-left:auto;align-items:center}
  .hstat .s{text-align:center;min-width:64px}
  .hstat .s b{font-size:19px;display:block}
  .hstat .s span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .main{flex:1;display:grid;grid-template-columns:340px 280px 1fr 260px;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
  .col:last-child{border-right:none}
  .col-head{padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-shrink:0}
  .col-body{flex:1;overflow-y:auto;padding:10px;min-height:0}
  .toolbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2);flex-shrink:0}
  .fbtn{background:#1a2544;border:1px solid var(--line);color:var(--mut);font-size:11px;padding:5px 10px;border-radius:14px;cursor:pointer}
  .fbtn.active{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
  .search{width:100%;padding:7px 10px;margin-top:6px;background:#0a1226;border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:12px;outline:none}
  .search:focus{border-color:var(--acc)}
  .bulkbar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:11px;color:var(--mut);flex-wrap:wrap;flex-shrink:0}
  .bulkbar button{background:var(--acc);border:none;color:#04121f;font-weight:700;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px}
  .bulkbar button:disabled{opacity:.4;cursor:not-allowed}
  .bulkbar button.danger{background:var(--crit);color:#fff}
  .inc-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:10px;padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:.15s}
  .inc-card:hover{border-color:var(--acc);transform:translateX(2px)}
  .inc-card.sel-Critical{border-left-color:var(--crit)}
  .inc-card.sel-High{border-left-color:var(--high)}
  .inc-card.sel-Medium{border-left-color:var(--warn)}
  .inc-card.sel-Low{border-left-color:var(--ok)}
  .inc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .inc-top input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;cursor:pointer;flex-shrink:0}
  .inc-id{font-weight:700;font-size:13px}
  .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;text-transform:uppercase;white-space:nowrap}
  .b-Critical{background:rgba(248,113,113,.15);color:var(--crit)}
  .b-High{background:rgba(251,146,60,.15);color:var(--high)}
  .b-Medium{background:rgba(251,191,36,.15);color:var(--warn)}
  .b-Low{background:rgba(52,211,153,.15);color:var(--ok)}
  .b-status{background:rgba(56,189,248,.13);color:var(--acc)}
  .b-merged{background:rgba(192,132,252,.15);color:var(--ai);font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
  .inc-desc{font-size:12px;color:var(--txt);margin:6px 0 4px;line-height:1.35}
  .inc-meta{font-size:11px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sla{font-variant-numeric:tabular-nums}
  .sla.over{color:var(--crit);font-weight:700}
  .sla.soon{color:var(--warn);font-weight:600}
  .sla.ok{color:var(--ok)}
  .merge-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ai);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
  .merge-card:hover{border-color:var(--ai);transform:translateX(2px)}
  .merge-card.sel-Critical{border-left-color:var(--crit)}
  .merge-card.sel-High{border-left-color:var(--high)}
  .merge-card.sel-Medium{border-left-color:var(--warn)}
  .merge-card.sel-Low{border-left-color:var(--ok)}
  .mc-top{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
  .mc-id{font-weight:700;font-size:13px;color:var(--ai)}
  .mc-count{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(192,132,252,.18);color:var(--ai);font-weight:700}
  .mc-category{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:3px}
  .mc-location{font-size:11px;color:var(--mut);margin-bottom:7px}
  .mc-reports{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
  .mc-report-row{background:var(--panel2);border-radius:7px;padding:7px 9px;font-size:11px;border-left:3px solid var(--ai)}
  .mc-report-row:first-child{border-left-color:var(--acc)}
  .mc-report-name{font-weight:600;color:var(--txt);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
  .mc-report-time{color:var(--mut);font-size:10px}
  .mc-report-msg{color:var(--mut);line-height:1.35;margin-top:2px}
  .mc-score-bar{height:3px;border-radius:2px;background:var(--line);margin-bottom:6px;overflow:hidden}
  .mc-score-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ai),var(--acc))}
  .mc-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
  .mc-reason{font-size:10px;color:var(--mut);font-style:italic;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-actions{display:flex;gap:6px;flex-shrink:0}
  .mc-btn{font-size:10px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font-weight:600;white-space:nowrap}
  .mc-btn:hover{border-color:var(--ai);color:var(--ai)}
  .mc-btn.open{border-color:var(--acc);color:var(--acc)}
  .mc-btn.open:hover{background:#0f2038}
  .mc-empty{color:var(--mut);font-size:12px;padding:28px 14px;text-align:center;line-height:1.6}
  .mc-empty .mc-empty-icon{font-size:32px;display:block;margin-bottom:8px;opacity:.5}
  .ai-analysis{background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.25);border-radius:8px;padding:7px 9px;margin-bottom:8px;font-size:11px;color:var(--ai);line-height:1.4}
  .ai-analysis strong{display:block;margin-bottom:2px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
  .merge-hbadge{background:rgba(192,132,252,.2);color:var(--ai);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:auto}
  #map{flex:1;min-height:0;background:#0a1226}
  .map-toolbar{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);align-items:center;flex-shrink:0}
  .map-toolbar button{background:#1a2544;border:1px solid var(--line);color:var(--txt);font-size:11px;padding:6px 11px;border-radius:7px;cursor:pointer}
  .map-toolbar button:hover{border-color:var(--acc);color:var(--acc)}
  .legend{position:absolute;bottom:14px;right:10px;z-index:500;background:rgba(10,16,32,.92);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:11px;color:var(--mut)}
  .legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .map-wrap{position:relative;flex:1;display:flex;min-height:0}
  .pin-lbl{background:rgba(10,16,32,.9);color:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10px;white-space:nowrap}
  .mapswitch{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .mapswitch button{background:rgba(10,16,32,.92);color:var(--mut);border:none;padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer}
  .mapswitch button.on{background:var(--acc);color:#04121f}
  /* Units column */
  .unit-card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:12px}
  .unit-card.dispatched{border-left:3px solid var(--warn)}
  .unit-card.available{border-left:3px solid var(--ok)}
  .unit-card.onscene{border-left:3px solid var(--crit)}
  .unit-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .unit-id{font-weight:700;font-size:13px}
  .unit-status{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .unit-status.ok{color:var(--ok)}
  .unit-status.warn{color:var(--warn)}
  .unit-status.crit{color:var(--crit)}
  .unit-assign{font-size:11px;color:var(--mut);margin-top:2px}
  /* Hospital sync panel */
  .hosp-sync{background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.3);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:11px}
  .hosp-sync-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:700;color:var(--ok);font-size:12px}
  .hosp-sync-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(52,211,153,.1)}
  .hosp-sync-row:last-child{border-bottom:none}
  .overlay{position:fixed;inset:0;background:rgba(4,8,18,.75);display:none;align-items:center;justify-content:center;z-index:2000}
  .overlay.show{display:flex}
  .modal{width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  .modal h2{font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap}
  .modal .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .mbox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .mbox label{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px}
  .mbox .v{font-size:13px;font-weight:600}
  .reporter{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:7px;font-size:12px}
  .reporter .rhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  select{background:#0a1226;border:1px solid var(--line);color:var(--txt);padding:7px 9px;border-radius:7px;font-size:12px;outline:none}
  .ulist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .uqty{display:flex;align-items:center;gap:12px;background:#0a1226;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .uqty .uq-name{flex:1;font-size:13px;font-weight:600}
  .uqty .uq-name small{display:block;color:var(--mut);font-size:10px;font-weight:400}
  .uq-ctrl{display:flex;align-items:center;gap:9px}
  .uq-ctrl button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#1a2544;color:var(--txt);font-size:15px;cursor:pointer;line-height:1}
  .uq-ctrl button:hover{border-color:var(--acc);color:var(--acc)}
  .uq-ctrl b{min-width:20px;text-align:center;font-size:16px}
  .mbtn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .mbtn.pri{background:var(--acc);color:#04121f}
  .mbtn.ok{background:var(--ok);color:#04121f}
  .mbtn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
  .mbtn:hover{filter:brightness(1.12)}
  .ai-summary{background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.3);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .ai-summary .ai-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ai);font-weight:700;margin-bottom:6px}
  .ai-summary p{font-size:12px;color:var(--txt);line-height:1.55;margin:0}
  .ai-summary .ai-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .ai-summary .ai-tag{font-size:10px;padding:2px 9px;border-radius:10px;background:rgba(192,132,252,.15);color:var(--ai);font-weight:600}
  #toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--panel);border:1px solid var(--ai);color:var(--txt);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:rise .25s;max-width:520px}
  .toast.info{border-color:var(--acc)}
  .toast.good{border-color:var(--ok)}
  .toast.hosp{border-color:var(--ok);background:rgba(52,211,153,.08)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .col-body::-webkit-scrollbar{width:4px}
  .col-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg></div>
    <div>
      <h1>SAHAYAK <span style="color:var(--mut);font-weight:400">— Dispatcher Console</span></h1>
      <small style="color:var(--mut);font-size:11px">Control Room · Nadiad District · Live sync with Hospital Portal</small>
    </div>
  </div>
  <div class="hstat">
    <div class="s"><b id="st-active">0</b><span>Active</span></div>
    <div class="s"><b style="color:var(--crit)" id="st-crit">0</b><span>Critical</span></div>
    <div class="s"><b style="color:var(--ai)" id="st-merged">0</b><span>Merged</span></div>
    <div class="s"><b style="color:var(--acc)" id="st-enroute">0</b><span>En route</span></div>
    <div class="s"><b style="color:var(--ok)" id="st-resolved">0</b><span>Resolved</span></div>
  </div>
</header>

<div class="main">

  <!-- COL 1: QUEUE -->
  <div class="col">
    <div class="col-head">📥 Incident Queue <span id="qcount" style="margin-left:auto;color:var(--acc);font-size:11px"></span></div>
    <div class="toolbar">
      <button class="fbtn active" data-f="all">All</button>
      <button class="fbtn" data-f="new">New</button>
      <button class="fbtn" data-f="active">Active</button>
      <button class="fbtn" data-f="resolved">Resolved</button>
      <input class="search" id="search" placeholder="Search location / category / ID…">
    </div>
    <div class="bulkbar">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
        <input type="checkbox" id="selAll" style="accent-color:var(--acc)"> Select all
      </label>
      <button id="bulkDispatch" disabled>Dispatch selected</button>
      <button id="btnDeleteResolved" class="danger">🗑 Delete resolved</button>
      <span id="bulkCount"></span>
    </div>
    <div class="col-body" id="queue"></div>
  </div>

  <!-- COL 2: MERGED -->
  <div class="col">
    <div class="col-head">🤖 AI Merged <span class="merge-hbadge" id="mergeHeaderCount">0</span></div>
    <div class="col-body" id="mergeCol"></div>
  </div>

  <!-- COL 3: MAP -->
  <div class="col">
    <div class="map-toolbar">
      <button id="btnRecenter">⌖ Recenter</button>
      <button id="btnFit">⤢ Fit all</button>
      <button id="btnToggleRadius">◎ Radii</button>
      <span style="margin-left:auto;font-size:11px;color:var(--mut)" id="mapClock"></span>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="legend">
        <div><i style="background:var(--crit)"></i> Critical</div>
        <div><i style="background:var(--high)"></i> High</div>
        <div><i style="background:var(--warn)"></i> Medium</div>
        <div><i style="background:var(--ok)"></i> Low</div>
        <div><i style="background:var(--acc)"></i> Ambulance</div>
        <div><i style="background:var(--ai)"></i> Merged cluster</div>
        <div><i style="background:var(--ok);border-radius:2px"></i> Hospital</div>
      </div>
    </div>
  </div>

  <!-- COL 4: UNITS -->
  <div class="col">
    <div class="col-head">🚑 Units <span id="unitCount" style="margin-left:auto;color:var(--ok)"></span></div>
    <div style="padding:10px;flex:1;overflow-y:auto" id="unitsCol"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
"use strict";

/* =====================================================
   STORAGE KEYS — shared with hospital
===================================================== */
var K = {
  QUEUE:      "sahayak_queue",
  PROCESSED:  "sahayak_dispatcher_processed",
  STATE:      "sahayak_dispatcher_state",
  AUTHORITY:  "resqnet_authority_incidents",
  AMB_STATE:  "sahayak_ambulance_state",   // ← shared with hospital
  HOSP_CAP:   "sahayak_hospital_capacity"  // ← read from hospital
};

var AI_MERGE_ENABLED = true;
var MERGE_THRESHOLD  = 0.70;
var NADIAD = [22.6911, 72.8667];
var HOSPITAL_POS = [22.6911, 72.8667];

/* =====================================================
   HELPERS
===================================================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function shortText(t,n){ t=String(t||""); n=n||44; return t.length>n?t.slice(0,n)+"…":t; }
function normalize(t){ return String(t||"").toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
function tokenize(t){ return normalize(t).split(" ").filter(function(w){ return w.length>1; }); }

/* =====================================================
   AI MERGE ENGINE
===================================================== */
var TYPE_KEYWORDS = {
  "Road accident":     ["accident","crash","crashed","collision","collided","truck","bus","car","bike","motorbike","scooter","auto","rickshaw","lorry","vehicle","train","derailed","overturned","pileup","skid","skidded","rammed","hit by"],
  "Fire":              ["fire","burning","burn","burnt","smoke","flames","blaze","explosion","blast","exploded","ignite"],
  "Medical":           ["medical","heart","heartattack","unconscious","bleeding","bleed","injured","injury","injuries","fainted","fainting","breathing","stroke","fracture","patient","collapsed","chest pain","unresponsive"],
  "Flood":             ["flood","flooded","flooding","water","overflow","submerged","drowning","waterlogging","waterlogged","heavy rain","storm"],
  "Gas leak":          ["gas","leak","leaking","leakage","lpg","cylinder","fumes"],
  "Building collapse": ["collapse","collapsed","building fell","structure fell","wall fell","debris"],
  "Crime":             ["robbery","robbed","theft","stolen","assault","murder","kidnap","gun","fight","attack by"],
  "Electrical":        ["electric","electrical","shock","electrocuted","transformer","short circuit","live wire","power line"]
};
var STOP_WORDS = ("near outside at the on in of to from is are was were there here please help urgent and or my our his her its some very big just now close by side front back gate area around next to a an it for with without one two three many people person man woman child kids sir nadiad gujarat india district city town village").split(" ");
var SEV_CRIT = ["dead","died","death","critical","severe","explosion","blast","collapsed","trapped","fire","unconscious","heavy bleeding","multiple injured","serious"];
var SEV_HIGH = ["serious","trapped","injured","bleeding","spread","spreading","stuck"];
var SEV_LOW  = ["minor","small","slight","little"];

function classifyType(text){
  var toks=tokenize(text), best=null, bestHits=0;
  Object.keys(TYPE_KEYWORDS).forEach(function(cat){
    var hits=0;
    TYPE_KEYWORDS[cat].forEach(function(kw){
      if(kw.indexOf(" ")>-1){ if(normalize(text).indexOf(kw)>-1) hits++; }
      else if(toks.indexOf(kw)>-1) hits++;
    });
    if(hits>bestHits){ bestHits=hits; best=cat; }
  });
  var fireHits=0;
  TYPE_KEYWORDS["Fire"].forEach(function(kw){ if(toks.indexOf(kw)>-1) fireHits++; });
  if(fireHits>0&&fireHits>=bestHits) best="Fire";
  return best||"Other";
}
function inferSeverity(text){
  var n=normalize(text);
  for(var i=0;i<SEV_CRIT.length;i++) if(n.indexOf(SEV_CRIT[i])>-1) return "Critical";
  for(i=0;i<SEV_HIGH.length;i++) if(n.indexOf(SEV_HIGH[i])>-1) return "High";
  for(i=0;i<SEV_LOW.length;i++) if(n.indexOf(SEV_LOW[i])>-1) return "Low";
  return "Medium";
}
function extractLandmarks(text){
  var typeWords={};
  Object.keys(TYPE_KEYWORDS).forEach(function(c){ TYPE_KEYWORDS[c].forEach(function(w){ typeWords[w]=1; }); });
  return tokenize(text).filter(function(w){ return STOP_WORDS.indexOf(w)===-1&&!typeWords[w]&&!/^\d+$/.test(w); });
}
function jaccard(a,b){
  if(!a.length||!b.length) return 0;
  var A={},B={},inter=0,uni=0;
  a.forEach(function(x){A[x]=1;}); b.forEach(function(x){B[x]=1;});
  Object.keys(A).forEach(function(x){ uni++; if(B[x]) inter++; });
  Object.keys(B).forEach(function(x){ if(!A[x]) uni++; });
  return uni?inter/uni:0;
}
function haversine(p1,p2){
  var R=6371000,dLat=(p2[0]-p1[0])*Math.PI/180,dLng=(p2[1]-p1[1])*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(p1[0]*Math.PI/180)*Math.cos(p2[0]*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
function computeMergeScore(rep,inc){
  var typeSim=rep.category===inc.category?1:(rep.category==="Other"||inc.category==="Other"?0.5:0);
  var repLM=extractLandmarks((rep.message||"")+" "+(rep.location||""));
  var incLM=[];
  inc.reports.forEach(function(r){ incLM=incLM.concat(extractLandmarks((r.message||"")+" "+(r.location||""))); });
  var textLoc=jaccard(repLM,incLM);
  var shared=repLM.filter(function(w){ return incLM.indexOf(w)>-1; });
  if(shared.length>=2) textLoc=Math.min(1,textLoc+0.30);
  else if(shared.length===1) textLoc=Math.min(0.6,textLoc+0.15);
  var geoLoc=0;
  if(rep.lat&&rep.lng&&inc.lat&&inc.lng){
    var d=haversine([rep.lat,rep.lng],[inc.lat,inc.lng]);
    geoLoc=d<200?1:(d<1000?1-(d-200)/800:0);
  }
  var locSim=(rep.lat&&inc.lat)?geoLoc:textLoc;
  if(rep.lat&&inc.lat&&haversine([rep.lat,rep.lng],[inc.lat,inc.lng])>1000) locSim=Math.min(locSim,0.2);
  var dtMin=(Date.now()-inc.lastReport)/60000;
  var timeSim=dtMin<=10?1:(dtMin<=60?1-(dtMin-10)/50:0);
  var score=0.35*typeSim+0.50*locSim+0.15*timeSim;
  var reasons=[];
  if(typeSim===1) reasons.push("same type");
  if(shared.length>=2) reasons.push("landmarks: "+shared.slice(0,3).join(", "));
  else if(shared.length===1) reasons.push("shared: \""+shared[0]+"\"");
  if(geoLoc>=0.9) reasons.push("GPS <200m");
  if(timeSim>0.5) reasons.push(Math.round(dtMin)+"min apart");
  return{score:score,reason:reasons.join(" + ")||"weak match"};
}
function findMergeCandidate(rep){
  var best=null;
  STATE.incidents.forEach(function(inc){
    if(inc.status==="Resolved") return;
    var s=computeMergeScore(rep,inc);
    if(!best||s.score>best.info.score) best={inc:inc,info:s};
  });
  if(best&&best.info.score>=MERGE_THRESHOLD) return best;
  return null;
}
function severityRank(s){ return{Critical:4,High:3,Medium:2,Low:1}[s]||2; }
function generateAISummary(inc){
  if(inc.reports.length<2) return null;
  var allText=inc.reports.map(function(r){return r.message||"";}).join(" ");
  var n=normalize(allText);
  var hasDeath=/(dead|died|death|fatality|killed)/.test(n);
  var hasInjured=/(injur|bleed|wound|hurt|casualt)/.test(n);
  var hasTrapped=/(trap|stuck|pinned|rescue)/.test(n);
  var hasFire=/(fire|burn|flame|blaze|smoke)/.test(n);
  var hasFlood=/(flood|water|overflow|submerge|drown)/.test(n);
  var hasGas=/(gas|fume|leak|lpg|cylinder)/.test(n);
  var loc=inc.reports[0].location||inc.location||"the area";
  var parts=[inc.reports.length+" independent reports confirm a "+inc.severity.toLowerCase()+" "+inc.category.toLowerCase()+" at "+loc+"."];
  if(hasDeath) parts.push("⚠️ Fatalities reported.");
  if(hasInjured) parts.push("Casualties confirmed — immediate medical response required.");
  if(hasTrapped) parts.push("People reported trapped — rescue equipment needed.");
  if(hasFire) parts.push("Active fire — fire suppression units critical.");
  if(hasFlood) parts.push("Flooding reported — water rescue may be needed.");
  if(hasGas) parts.push("Gas leak suspected — evacuate 200m radius.");
  var tags=[];
  if(inc.severity==="Critical") tags.push("Critical");
  if(hasDeath) tags.push("Fatality");
  if(hasInjured) tags.push("Casualties");
  if(hasTrapped) tags.push("Rescue needed");
  if(hasFire) tags.push("Fire");
  if(hasFlood) tags.push("Flood");
  if(inc.reports.length>=3) tags.push("High confidence merge");
  return{text:parts.join(" "),tags:tags};
}

var UNIT_RULES={
  "Road accident":["AMB","POL"],
  "Fire":["FIR","AMB"],
  "Medical":["AMB"],
  "Flood":["FIR","POL","AMB"],
  "Gas leak":["FIR","POL"],
  "Building collapse":["FIR","AMB","POL"],
  "Crime":["POL","AMB"],
  "Electrical":["FIR","AMB"],
  "Other":["AMB","POL"]
};
function recommendTypes(inc){
  var types=(UNIT_RULES[inc.category]||UNIT_RULES["Other"]).slice();
  var text=normalize(inc.reports.map(function(r){return r.message;}).join(" "));
  if(/(trapped|stuck|pinned|rescue)/.test(text)&&types.indexOf("FIR")===-1) types.push("FIR");
  if(/(injur|bleed|wound|unconscious|pain|dead|died)/.test(text)&&types.indexOf("AMB")===-1) types.push("AMB");
  if(inc.severity==="Critical"&&types.indexOf("POL")===-1) types.push("POL");
  return types;
}
function unitById(id){ return STATE.units.filter(function(u){return u.id===id;})[0]; }
var UNIT_META={AMB:{icon:"🚑",label:"Ambulance"},FIR:{icon:"🚒",label:"Fire tender"},POL:{icon:"🚓",label:"Police"}};

function applyQuantities(inc,want){
  var types=Object.keys(want);
  inc.assigned.forEach(function(uid){ var u=unitById(uid); if(u&&types.indexOf(u.type)===-1) types.push(u.type); });
  var picked=[];
  types.forEach(function(t){
    var committed=inc.assigned.filter(function(uid){ var u=unitById(uid); return u&&u.type===t; });
    var n=(t in want)?(want[t]||0):committed.length;
    var extra=Math.max(0,n-committed.length);
    var take=STATE.units.filter(function(u){return u.status==="Available"&&u.type===t;}).slice(0,extra);
    picked=picked.concat(committed,take.map(function(u){return u.id;}));
  });
  inc.assigned=picked;
  picked.forEach(function(uid){ var u=unitById(uid); if(u) u.status="Dispatched"; });
  return picked;
}

function syncAmbulanceState(){
  // Build a clean ambulance-only snapshot that the hospital reads
  var ambUnits = STATE.units.filter(function(u){ return u.type==="AMB"; });

  var snapshot = ambUnits.map(function(u){
    // Find which incident this ambulance is assigned to
    var assignedInc = null;
    STATE.incidents.forEach(function(inc){
      if(inc.assigned && inc.assigned.indexOf(u.id) > -1 && inc.status !== "Resolved"){
        assignedInc = inc;
      }
    });

    return {
      id:         u.id,
      name:       u.name,
      icon:       u.icon,
      status:     u.status,                            // Available / Dispatched / On scene
      pos:        u.pos,
      incidentId: assignedInc ? assignedInc.id : null,
      incidentCategory: assignedInc ? assignedInc.category : null,
      incidentSeverity: assignedInc ? assignedInc.severity : null,
      incidentLocation: assignedInc ? assignedInc.location : null,
      incidentLat: assignedInc ? assignedInc.lat : null,
      incidentLng: assignedInc ? assignedInc.lng : null,
      dispatchedAt: (u.status !== "Available" && assignedInc) ? assignedInc.lastReport : null
    };
  });

  var counts = {
    total:      ambUnits.length,
    available:  ambUnits.filter(function(u){ return u.status==="Available"; }).length,
    dispatched: ambUnits.filter(function(u){ return u.status==="Dispatched"; }).length,
    onScene:    ambUnits.filter(function(u){ return u.status==="On scene"; }).length,
    lastSync:   Date.now()
  };

  try{
    localStorage.setItem(K.AMB_STATE, JSON.stringify({ units: snapshot, counts: counts }));
  }catch(e){}
}

function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(K.STATE)||"null");
    if(s&&s.incidents){
      STATE.incidents=s.incidents; STATE.counter=s.counter||0;
      var units=(s.units&&s.units.length)?s.units:UNITS_SEED;
      STATE.units=units.map(function(u){
        return{id:u.id,icon:u.icon,name:u.name,pos:u.pos,
               type:(u.type==="FIRE")?"FIR":(u.type||"AMB"),
               status:(u.status==="Dispatched"||u.status==="On scene")?u.status:"Available"};
      });
      return true;
    }
  }catch(e){}
  return false;
}
function processedIds(){
  try{return JSON.parse(localStorage.getItem(K.PROCESSED)||"[]");}catch(e){return[];}
}
function markProcessed(id){
  var p=processedIds();
  if(p.indexOf(id)===-1){p.push(id);if(p.length>300)p=p.slice(-300);localStorage.setItem(K.PROCESSED,JSON.stringify(p));}
}
function nextId(){ STATE.counter++; return "INC-"+String(1000+STATE.counter); }

function createIncident(rep){
  var now=Date.now();
  var inc={
    id:nextId(),category:rep.category,severity:rep.severity,status:"New",
    location:rep.location||"Nadiad",
    lat:rep.lat||(NADIAD[0]+(Math.random()-.5)*.02),
    lng:rep.lng||(NADIAD[1]+(Math.random()-.5)*.02),
    created:now,lastReport:now,slaDeadline:now+10*60*1000,
    assigned:[],mergeScores:[],
    reports:[{name:rep.name||"Citizen",phone:rep.phone||"—",message:rep.message,location:rep.location||"",time:rep.time||now}]
  };
  STATE.incidents.unshift(inc);
  return inc;
}
function mergeReport(inc,rep,score){
  inc.reports.push({name:rep.name||"Citizen",phone:rep.phone||"—",message:rep.message,location:rep.location||"",time:rep.time||Date.now()});
  inc.lastReport=Date.now();
  if(!inc.mergeScores) inc.mergeScores=[];
  inc.mergeScores.push(score);
  if(severityRank(rep.severity)>severityRank(inc.severity)) inc.severity=rep.severity;
}
function ingestReport(rep){
  rep.category=rep.category&&TYPE_KEYWORDS[rep.category]?rep.category:classifyType(rep.message);
  rep.severity=rep.severity||inferSeverity(rep.message);
  var cand=AI_MERGE_ENABLED?findMergeCandidate(rep):null;
  if(cand){
    mergeReport(cand.inc,rep,cand.info.score);
    toast("🤖 AI merged report into "+cand.inc.id+" (score: "+cand.info.score.toFixed(2)+")", "info");
  } else {
    createIncident(rep);
  }
  saveState(); renderAll();
}

function pollQueue(){
  var raw; try{raw=JSON.parse(localStorage.getItem(K.QUEUE)||"[]");}catch(e){return;}
  if(raw&&!Array.isArray(raw)) raw=[raw];
  if(!Array.isArray(raw)||!raw.length) return;
  var done=processedIds(), found=false;
  raw.forEach(function(item){
    if(!item) return;
    var id=item.id||String("h"+JSON.stringify(item).length+"|"+(item.time||0)+"|"+(item.message||"").slice(0,24));
    if(done.indexOf(id)>-1) return;
    var rep={id:id,name:item.name||"Citizen",phone:item.phone||"—",
              message:item.message||item.text||item.description||"",
              location:item.location||item.address||"",
              lat:parseFloat(item.lat||0)||null,
              lng:parseFloat(item.lng||item.lon||0)||null,
              category:item.category||null,time:item.time||Date.now()};
    if(!rep.message) rep.message=rep.category?rep.category+" reported":"Emergency reported";
    if(typeof rep.category==="string"&&!TYPE_KEYWORDS[rep.category]){
      var map={"accident":"Road accident","road accident":"Road accident","medical":"Medical","medical emergency":"Medical","fire":"Fire","flood":"Flood","crime":"Crime","gas leak":"Gas leak","building collapse":"Building collapse","electrical":"Electrical","other":"Other"};
      rep.category=map[normalize(rep.category)]||null;
    }
    ingestReport(rep); markProcessed(id); found=true;
  });
  if(found){ try{localStorage.setItem(K.QUEUE,JSON.stringify([]));}catch(e){} }
}

/* =====================================================
   MAP
===================================================== */
var map=null, layerInc=null, layerUnit=null, mapFitted=false;

function initMap(){
  if(typeof L==="undefined"){ var me=document.getElementById("map"); if(me) me.innerHTML='<div style="padding:30px;color:var(--mut)">Map unavailable.</div>'; return; }
  var me=document.getElementById("map"); if(!me) return;
  try{
    map=L.map("map",{zoomControl:true}).setView(NADIAD,13);
    var road=L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",{maxZoom:20}).addTo(map);
    var sat=L.layerGroup([
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20}),
      L.tileLayer("https://mt1.google.com/vt/lyrs=h&x={x}&y={y}&z={z}",{maxZoom:20})
    ]);
    var sw=L.control({position:"bottomleft"});
    sw.onAdd=function(){
      var d=L.DomUtil.create("div","mapswitch");
      d.innerHTML='<button data-m="map" class="on">Map</button><button data-m="sat">Satellite</button>';
      L.DomEvent.disableClickPropagation(d);
      d.addEventListener("click",function(e){
        var b=e.target.closest("button"); if(!b) return;
        if(b.getAttribute("data-m")==="sat"){map.removeLayer(road);sat.addTo(map);}
        else{map.removeLayer(sat);road.addTo(map);}
        Array.prototype.forEach.call(d.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);});
      });
      return d;
    };
    sw.addTo(map);
    layerInc=L.layerGroup().addTo(map);
    layerUnit=L.layerGroup().addTo(map);
  }catch(e){}
}

function sevColor(s){ return s==="Critical"?"#f87171":s==="High"?"#fb923c":s==="Medium"?"#fbbf24":"#34d399"; }

function renderMap(){
  if(!map||!layerInc||!layerUnit) return;
  layerInc.clearLayers(); layerUnit.clearLayers();
  var bounds=[];

  // Hospital marker
  L.marker(HOSPITAL_POS,{
    icon:L.divIcon({html:'<div style="background:#34d399;border:2px solid #fff;border-radius:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px">🏥</div>',className:"",iconSize:[22,22]})
  }).bindTooltip('<span class="pin-lbl">Civil Hospital Nadiad</span>').addTo(layerInc);

  STATE.incidents.forEach(function(i){
    if(!i.lat||!i.lng||i.status==="Resolved") return;
    var color=sevColor(i.severity);
    var isMerged=i.reports&&i.reports.length>1;
    var m=L.circleMarker([i.lat,i.lng],{radius:isMerged?11:9,color:isMerged?"#c084fc":color,weight:isMerged?3:2,fillColor:color,fillOpacity:.85})
      .bindTooltip('<span class="pin-lbl">'+esc(i.id)+' · '+esc(i.category)+' · '+esc(i.severity)+(isMerged?' · 🤖 '+i.reports.length+' reports':'')+'</span>')
      .on("click",function(){openModal(i.id);});
    layerInc.addLayer(m);
    bounds.push([i.lat,i.lng]);
    if(STATE.showRadius&&(i.severity==="Critical"||i.severity==="High")){
      layerInc.addLayer(L.circle([i.lat,i.lng],{radius:i.severity==="Critical"?400:250,color:isMerged?"#c084fc":color,weight:1,fillColor:isMerged?"#c084fc":color,fillOpacity:.1}));
    }
    i.assigned.forEach(function(uid){
      var u=STATE.units.filter(function(x){return x.id===uid;})[0];
      if(!u||!u.pos||u.pos.length<2) return;
      var to=(i.status==="On scene")?[i.lat,i.lng]:(i.status==="En route"?[(u.pos[0]+i.lat)/2,(u.pos[1]+i.lng)/2]:u.pos);
      // Draw route from unit to incident AND from incident to hospital (for ambulances)
      layerInc.addLayer(L.polyline([u.pos,to],{color:"#38bdf8",weight:2,dashArray:"6 8"}));
      if(u.type==="AMB"){
        // Extra dashed line from incident to hospital showing patient journey
        layerInc.addLayer(L.polyline([[i.lat,i.lng],HOSPITAL_POS],{color:"#34d399",weight:1.5,dashArray:"4 8",opacity:.6}));
      }
      var um=L.marker(to,{
        icon:L.divIcon({html:'<div style="font-size:18px">'+u.icon+'</div>',className:"",iconSize:[24,24]})
      }).bindTooltip('<span class="pin-lbl">'+esc(u.id)+' → '+esc(i.id)+'</span>');
      layerUnit.addLayer(um);
    });
  });

  if(!mapFitted&&bounds.length){ mapFitted=true; try{map.fitBounds(bounds,{padding:[40,40]});}catch(e){} }
}

/* =====================================================

function toast(html,cls){
  var t=document.createElement("div");
  t.className="toast "+(cls||"");
  t.textContent=html;
  var tc=document.getElementById("toasts"); if(tc) tc.appendChild(t);
  setTimeout(function(){t.style.opacity="0";t.style.transition=".4s";},3800);
  setTimeout(function(){if(t.parentNode)t.remove();},4300);
}

      n.textContent=v;
    });

  document.getElementById("mClose").onclick=closeModal;
  document.getElementById("mStatus").onchange=function(){
    var oldStatus=inc.status;
    inc.status=this.value;
    if(inc.status==="Resolved"||inc.status==="New") freeUnits(inc);
    else if(inc.status==="On scene") STATE.units.forEach(function(u){if(inc.assigned.indexOf(u.id)>-1)u.status="On scene";});
    saveState(); renderAll();
    if(inc.status==="Resolved"){ closeModal(); toast("✅ "+inc.id+" resolved — ambulances returned to hospital","good"); }

  };

    inc.status="Resolved";
    freeUnits(inc);
    saveState(); renderAll(); closeModal();
    toast("✅ "+inc.id+" resolved — ambulances returning to base","good");
  };

    var want={};
    document.querySelectorAll("#mUnits .uq-n").forEach(function(n){ want[n.getAttribute("data-type")]=parseInt(n.textContent,10)||0; });

    var picked=applyQuantities(inc,want);
    if(!picked.length){toast("Set at least one unit quantity","info");return;}
    inc.status="En route";

    // Count new ambulances dispatched
    var newAmb=inc.assigned.filter(function(uid){var u=unitById(uid);return u&&u.type==="AMB";}).length - prevAmb;

    saveState(); renderAll(); closeModal();
    toast("🚨 "+inc.id+" dispatched — "+picked.join(", ")+" en route to "+inc.location,"info");

    // Hospital gets notified via ambulance state sync (already done in saveState)
    if(newAmb>0){
      toast("🏥 Hospital notified: "+newAmb+" ambulance"+(newAmb>1?"s":"")+" dispatched to "+inc.location,"hosp");
    }
  };
}

function closeModal(){ document.getElementById("overlay").classList.remove("show"); }

function freeUnits(inc){
  inc.assigned.forEach(function(uid){
    var u=STATE.units.filter(function(x){return x.id===uid;})[0];
    var busy=STATE.incidents.some(function(o){return o!==inc&&o.status!=="Resolved"&&o.assigned.indexOf(uid)>-1;});
    if(u&&!busy) u.status="Available";
  });
  inc.assigned=[];
}

<script>
/* =====================================================
   SAHAYAK REPORT LEVEL ADD-ON
   ADD-ONLY: no existing Dispatcher code is changed.
   Fixes Fire / Flood / Road accident reports that were
   otherwise falling back to Medium.
===================================================== */
(function () {
  "use strict";

  function hasPhrase(text, phrases) {
    var value = normalize(text || "");
    for (var i = 0; i < phrases.length; i++) {
      if (value.indexOf(normalize(phrases[i])) !== -1) return true;
    }
    return false;
  }

  var CRITICAL_CUES = [
    "dead", "died", "death", "fatal", "killed",
    "unconscious", "unresponsive", "not breathing",
    "heavy bleeding", "severe bleeding",
    "trapped", "pinned", "drowning",
    "explosion", "blast", "multiple injured",
    "many injured", "multiple casualties"
  ];

  var HIGH_CUES = [
    "injured", "bleeding", "fracture", "broken bone",
    "overturned", "vehicle overturned", "traffic blocked",
    "heavy smoke", "spreading", "spread",
    "water rising", "water entering houses",
    "people stranded", "stuck"
  ];

  var LOW_CUES = [
    "minor", "small", "slight",
    "contained", "under control",
    "no injury", "no injuries",
    "nobody injured", "no one injured",
    "everyone safe", "all safe"
  ];

  function assessReportLevel(rep) {
    var category = String(rep && rep.category || "");
    var text = String(rep && rep.message || "");

    /* Explicit danger wording always has highest priority. */
    if (hasPhrase(text, CRITICAL_CUES)) return "Critical";

    /* FIRE */
    if (category === "Fire") {
      if (hasPhrase(text, LOW_CUES)) return "Low";
      if (hasPhrase(text, HIGH_CUES)) return "High";
      return "High";
    }

    /* FLOOD */
    if (category === "Flood") {
      if (hasPhrase(text, LOW_CUES)) return "Low";
      if (hasPhrase(text, ["drowning", "trapped", "water rising fast", "families trapped"])) {
        return "Critical";
      }
      return "High";
    }

    /* ROAD ACCIDENT */
    if (category === "Road accident") {
      if (hasPhrase(text, LOW_CUES)) return "Low";
      if (hasPhrase(text, HIGH_CUES)) return "High";
      return "Medium";
    }

    /*
      For every other emergency type, do nothing.
      Your original Dispatcher severity logic remains in control.
    */
    return null;
  }

  /*
    Wrap the existing ingestReport() instead of editing it.
    The original function still runs exactly as written.
  */
  if (typeof window.ingestReport === "function") {
    var originalIngestReportForLevel = window.ingestReport;

    window.ingestReport = function (rep) {
      var level = assessReportLevel(rep);

      if (level) {
        rep.severity = level;
      }

      return originalIngestReportForLevel(rep);
    };
  }
})();
</script>



<style>
/* SAHAYAK NORMAL PRIORITY — ADD-ONLY */
.inc-card.sel-Normal { border-left-color: var(--ok); }
.merge-card.sel-Normal { border-left-color: var(--ok); }
.b-Normal { background: rgba(52,211,153,.15); color: var(--ok); }
</style>

<script>
/* =====================================================
   SAHAYAK PRIORITY BRIDGE
   ADD-ONLY: no existing Dispatcher code is changed.

   The Report page already decides the automatic priority.
   This bridge preserves that value when the Dispatcher
   processes the existing "sahayak_queue".
===================================================== */
(function () {
  "use strict";

  function priorityRank(value) {
    return {
      Critical: 4,
      High: 3,
      Medium: 2,
      Normal: 1,
      Low: 1
    }[value] || 0;
  }

  function queuedPriority(reportId) {
    try {
      var queue = JSON.parse(localStorage.getItem("sahayak_queue") || "[]");
      if (!Array.isArray(queue)) queue = [queue];

      for (var i = 0; i < queue.length; i++) {
        if (
          queue[i] &&
          String(queue[i].id) === String(reportId) &&
          (queue[i].aiPriority || queue[i].severity)
        ) {
          return queue[i].aiPriority || queue[i].severity;
        }
      }
    } catch (e) {}

    return null;
  }

  function findIncidentContainingReport(rep) {
    var best = null;

    STATE.incidents.forEach(function (inc) {
      if (!inc || !Array.isArray(inc.reports)) return;

      var matched = inc.reports.some(function (r) {
        return (
          String(r.message || "") === String(rep.message || "") &&
          String(r.location || "") === String(rep.location || "")
        );
      });

      if (matched && (!best || inc.lastReport > best.lastReport)) {
        best = inc;
      }
    });

    return best;
  }

  /*
    Teach the existing merge severity comparison that
    "Normal" is below Medium.
  */
  if (typeof window.severityRank === "function") {
    var originalSeverityRankForPriority = window.severityRank;

    window.severityRank = function (severity) {
      if (severity === "Normal") return 1;
      return originalSeverityRankForPriority(severity);
    };
  }

  /*
    Wrap the CURRENT ingestReport(), including every existing
    add-on already in the uploaded Dispatcher.
  */
  if (typeof window.ingestReport === "function") {
    var originalIngestReportForAutoPriority = window.ingestReport;

    window.ingestReport = function (rep) {
      var desiredPriority = queuedPriority(rep && rep.id);

      var existingIds = {};
      STATE.incidents.forEach(function (inc) {
        existingIds[inc.id] = true;
      });

      var result = originalIngestReportForAutoPriority(rep);

      if (!desiredPriority) return result;

      var target = null;
      var isNewIncident = false;

      for (var i = 0; i < STATE.incidents.length; i++) {
        if (!existingIds[STATE.incidents[i].id]) {
          target = STATE.incidents[i];
          isNewIncident = true;
          break;
        }
      }

      if (!target) {
        target = findIncidentContainingReport(rep);
      }

      if (!target) return result;

      /*
        A brand-new incident gets exactly the automatically
        assessed priority.

        If the report was merged into an existing incident,
        it may only increase the incident priority — never lower it.
      */
      if (
        isNewIncident ||
        priorityRank(desiredPriority) > priorityRank(target.severity)
      ) {
        target.severity = desiredPriority;

        if (typeof saveState === "function") saveState();
        if (typeof renderAll === "function") renderAll();
      }

      return result;
    };
  }
})();
</script>



<script>
/* =====================================================
   SAHAYAK SIMILAR REPORT MERGE ADD-ON
   ADD-ONLY: no existing Dispatcher code is changed.

   Purpose:
   If the original merge engine does not merge a new report,
   this add-on performs a conservative fallback check so that
   clearly similar reports appear in the existing "AI Merged"
   column instead of becoming separate incidents.
===================================================== */
(function () {
  "use strict";

  function mergeNorm(value) {
    return String(value == null ? "" : value)
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  var MERGE_STOP_WORDS = {
    "the":1,"a":1,"an":1,"is":1,"are":1,"was":1,"were":1,
    "at":1,"in":1,"on":1,"near":1,"to":1,"from":1,"of":1,
    "and":1,"or":1,"for":1,"with":1,"this":1,"that":1,
    "there":1,"here":1,"please":1,"help":1,"urgent":1,
    "people":1,"person":1,"nadiad":1,"gujarat":1
  };

  function mergeTokens(value) {
    return mergeNorm(value)
      .split(" ")
      .filter(function (word) {
        return word.length > 2 && !MERGE_STOP_WORDS[word];
      });
  }

  function tokenSimilarity(a, b) {
    var A = mergeTokens(a);
    var B = mergeTokens(b);

    if (!A.length || !B.length) return 0;

    var seenA = {};
    var seenB = {};
    var intersection = 0;
    var union = 0;

    A.forEach(function (word) { seenA[word] = 1; });
    B.forEach(function (word) { seenB[word] = 1; });

    Object.keys(seenA).forEach(function (word) {
      union++;
      if (seenB[word]) intersection++;
    });

    Object.keys(seenB).forEach(function (word) {
      if (!seenA[word]) union++;
    });

    return union ? intersection / union : 0;
  }

  function locationMatch(rep, inc) {
    var repLocation = mergeNorm(rep.location || "");
    var incLocation = mergeNorm(inc.location || "");

    /* Exact / contained location text is a strong match. */
    if (repLocation && incLocation) {
      if (repLocation === incLocation) return 1;

      if (
        repLocation.length >= 5 &&
        incLocation.length >= 5 &&
        (repLocation.indexOf(incLocation) !== -1 ||
         incLocation.indexOf(repLocation) !== -1)
      ) {
        return 0.95;
      }
    }

    /* Reuse your existing GPS-distance helper when coordinates exist. */
    if (
      rep.lat && rep.lng &&
      inc.lat && inc.lng &&
      typeof haversine === "function"
    ) {
      var metres = haversine(
        [Number(rep.lat), Number(rep.lng)],
        [Number(inc.lat), Number(inc.lng)]
      );

      if (metres <= 200) return 1;
      if (metres <= 500) return 0.90;
      if (metres <= 800) return 0.75;
    }

    /* Fallback to location-token similarity. */
    return tokenSimilarity(repLocation, incLocation);
  }

  function incidentText(inc) {
    var parts = [];

    if (inc.location) parts.push(inc.location);

    if (Array.isArray(inc.reports)) {
      inc.reports.forEach(function (report) {
        if (report && report.message) parts.push(report.message);
      });
    }

    return parts.join(" ");
  }

  function fallbackMergeCandidate(rep) {
    if (!rep || !Array.isArray(STATE.incidents)) return null;

    var best = null;

    STATE.incidents.forEach(function (inc) {
      if (!inc || inc.status === "Resolved") return;

      /*
        Same emergency type is required for this fallback.
        This prevents a fire and a road accident at the same place
        from being merged just because their locations match.
      */
      if (
        rep.category &&
        inc.category &&
        rep.category !== inc.category
      ) {
        return;
      }

      var ageMinutes = (Date.now() - Number(inc.lastReport || inc.created || 0)) / 60000;

      /* Do not merge very old incidents through the fallback rule. */
      if (ageMinutes > 45) return;

      var locScore = locationMatch(rep, inc);
      var textScore = tokenSimilarity(
        (rep.message || "") + " " + (rep.location || ""),
        incidentText(inc)
      );

      /*
        Conservative merge rules:

        1. Same category + nearly identical location
           -> merge even when citizens describe the event differently.

        2. Same category + nearby GPS/location + similar wording
           -> merge.

        3. Very similar wording + at least some location agreement
           -> merge.
      */
      var qualifies =
        (locScore >= 0.95) ||
        (locScore >= 0.75 && textScore >= 0.18) ||
        (locScore >= 0.35 && textScore >= 0.42);

      if (!qualifies) return;

      var combinedScore =
        (0.65 * locScore) +
        (0.25 * textScore) +
        (0.10 * Math.max(0, 1 - (ageMinutes / 45)));

      if (!best || combinedScore > best.info.score) {
        best = {
          inc: inc,
          info: {
            score: Math.min(0.99, combinedScore),
            reason:
              "similar report fallback: same type + location/message match"
          }
        };
      }
    });

    return best;
  }

  /*
    Keep the original AI merge engine first.
    Only if it returns no candidate do we try the conservative
    fallback above. Nothing from the original logic is removed.
  */
  if (typeof window.findMergeCandidate === "function") {
    var originalFindMergeCandidate = window.findMergeCandidate;

    window.findMergeCandidate = function (rep) {
      var originalCandidate = originalFindMergeCandidate(rep);

      if (originalCandidate) {
        return originalCandidate;
      }

      return fallbackMergeCandidate(rep);
    };
  }
})();
</script>
